- id: agent-default-model
  config:
    provider: groq
    model: openai/gpt-oss-20b

- id: llm-pi-ai
  config:
    providers:
      groq:
        displayName: Groq Free Plan
        apiKeyEnv: GROQ_API_KEY
        api: openai-completions
        baseURL: https://api.groq.com/openai/v1
        models:
          - id: openai/gpt-oss-20b
            name: GPT-OSS 20B
            contextWindow: 131072
            maxTokens: 65536
          - id: openai/gpt-oss-120b
            name: GPT-OSS 120B
            contextWindow: 131072
            maxTokens: 65536
          - id: qwen/qwen3.6-27b
            name: Qwen3.6 27B
            contextWindow: 131072
            maxTokens: 16384

# These community plugins are bundled by DeepSeek Desktop. The installer shows
# a selection dialog after the non-official-distribution notice and writes the
# chosen enabled/disabled state into the user's profile. They never ship an API
# key and do not claim to be official DeepSeek components.
- id: deepseek-desktop-plugin-helper
  name: deepseek-desktop-plugin-helper

- id: deepseek-desktop-free-fallback
  name: deepseek-desktop-free-fallback
  config:
    primaryProvider: groq
    primaryModel: openai/gpt-oss-20b
    fallbackProvider: groq
    fallbackModel: openai/gpt-oss-120b

- id: deepseek-desktop-vision-preflight
  name: deepseek-desktop-vision-preflight

- id: deepseek-desktop-web-diagnostics
  name: deepseek-desktop-web-diagnostics

# These four community plugins are downloaded by the online installer from
# pinned npm/GitHub sources. The offline installer keeps the rows disabled.
- id: dsh-session-export
  name: dsh-session-export
  disabled: true

- id: dsh-mic-input
  name: dsh-mic-input
  disabled: true

- id: auto-continue
  name: dsh-client-auto-continue
  disabled: true

- id: ui-attention-badge
  name: dsh-web-attention-badge
  disabled: true

# The hosted vision sidecar is installed with the desktop payload but remains
# opt-in so the text-only free route stays the default. Enable this row in the
# profile patch when image input is needed.
- id: vision-sidecar
  name: dsh-vision-sidecar
  disabled: true

- id: llm-deepseek
  disabled: true

- id: web-search-deepseek
  disabled: true
