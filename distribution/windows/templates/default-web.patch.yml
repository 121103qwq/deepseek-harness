- id: agent-default-model
  config:
    provider: kilo
    model: kilo-auto/free

- id: llm-pi-ai
  config:
    providers:
      kilo:
        displayName: Kilo Auto Free（匿名）
        api: openai-completions
        baseURL: https://api.kilo.ai/api/gateway
        models:
          - id: kilo-auto/free
            name: Kilo Auto Free
            contextWindow: 256000
            maxTokens: 10000
            input:
              - text
      llm7:
        displayName: LLM7 匿名备用
        apiKeyEnv: LLM7_API_KEY
        api: openai-completions
        baseURL: https://api.llm7.io/v1
        models:
          - id: default
            name: LLM7 Default
            contextWindow: 128000
            maxTokens: 8192
            input:
              - text

# DeepSeek Desktop bundles every plugin below. The installer updates only these
# owned rows and preserves unrelated profile entries on an upgrade.
- insert:
    - id: deepseek-desktop-plugin-helper
      name: deepseek-desktop-plugin-helper

- insert:
    - id: deepseek-desktop-update-sync
      name: deepseek-desktop-update-sync
      config:
        checkInBackground: true
        allowBackgroundAutoUpdate: false
        intervalHours: 6

- insert:
    - id: deepseek-desktop-free-fallback
      name: deepseek-desktop-free-fallback
      config:
        primaryProvider: kilo
        primaryModel: kilo-auto/free
        fallbackProvider: llm7
        fallbackModel: default

- insert:
    - id: deepseek-desktop-vision-preflight
      name: deepseek-desktop-vision-preflight

- insert:
    - id: deepseek-desktop-web-diagnostics
      name: deepseek-desktop-web-diagnostics

- insert:
    - id: dsh-session-export
      name: dsh-session-export

- insert:
    - id: dsh-mic-input
      name: dsh-mic-input

- insert:
    - id: auto-continue
      name: dsh-client-auto-continue

- insert:
    - id: ui-attention-badge
      name: dsh-web-attention-badge

- id: ui-model-selection
  disabled: false

- insert:
    - id: vision-sidecar
      name: dsh-vision-sidecar
      disabled: true

- id: llm-deepseek
  disabled: true

- id: web-search-deepseek
  disabled: true
